<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Mi Lista">

    <title>Mi Lista de Compra</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f2f2f7;
            color: #111;
        }

        .app {
            max-width: 600px;
            margin: auto;
            min-height: 100vh;
            padding: 25px 16px 40px;
        }

        h1 {
            font-size: 32px;
            margin: 10px 0 5px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
        }

        .add-box {
            background: white;
            padding: 12px;
            border-radius: 18px;
            display: flex;
            gap: 8px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        #productInput {
            flex: 1;
            border: none;
            outline: none;
            font-size: 17px;
            min-width: 0;
            padding: 10px;
        }

        #quantityInput {
            width: 65px;
            border: none;
            background: #f2f2f7;
            border-radius: 12px;
            text-align: center;
            font-size: 17px;
            outline: none;
        }

        .add-button {
            border: none;
            background: #007aff;
            color: white;
            font-size: 17px;
            font-weight: 600;
            border-radius: 13px;
            padding: 0 17px;
            cursor: pointer;
        }

        .list {
            margin-top: 20px;
        }

        .item {
            background: white;
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .check {
            width: 25px;
            height: 25px;
            border: 2px solid #bbb;
            border-radius: 50%;
            flex-shrink: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 15px;
        }

        .item.checked .check {
            background: #34c759;
            border-color: #34c759;
        }

        .item-content {
            flex: 1;
            min-width: 0;
        }

        .product-name {
            font-size: 17px;
            font-weight: 500;
            word-break: break-word;
        }

        .quantity {
            font-size: 14px;
            color: #888;
            margin-top: 2px;
        }

        .item.checked .product-name {
            text-decoration: line-through;
            color: #999;
        }

        .delete {
            border: none;
            background: transparent;
            color: #ff3b30;
            font-size: 23px;
            cursor: pointer;
            padding: 5px;
        }

        .empty {
            text-align: center;
            color: #888;
            padding: 50px 20px;
        }

        .bottom-buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .secondary-button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 14px;
            background: white;
            color: #007aff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .danger-button {
            color: #ff3b30;
        }

        .counter {
            margin-top: 20px;
            text-align: center;
            color: #777;
            font-size: 14px;
        }

        @media (max-width: 400px) {
            .add-box {
                flex-wrap: wrap;
            }

            #productInput {
                width: 100%;
                flex-basis: 100%;
            }

            #quantityInput {
                height: 44px;
            }

            .add-button {
                height: 44px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <h1>🛒 Mi lista</h1>
    <div class="subtitle">Lista de la compra</div>

    <div class="add-box">
        <input
            id="productInput"
            type="text"
            placeholder="¿Qué necesitas?"
            autocomplete="off"
        >

        <input
            id="quantityInput"
            type="number"
            min="1"
            value="1"
        >

        <button class="add-button" onclick="addProduct()">
            Añadir
        </button>
    </div>

    <div id="list" class="list"></div>

    <div id="counter" class="counter"></div>

    <div class="bottom-buttons">
        <button class="secondary-button" onclick="removeChecked()">
            Borrar comprados
        </button>

        <button class="secondary-button danger-button" onclick="clearAll()">
            Vaciar lista
        </button>
    </div>

</div>

<script>

    // Cargar productos guardados
    let products = JSON.parse(localStorage.getItem("shoppingList")) || [];

    // Mostrar lista al abrir
    render();

    // Añadir producto pulsando ENTER
    document.getElementById("productInput").addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            addProduct();
        }
    });

    function addProduct() {

        const input = document.getElementById("productInput");
        const quantityInput = document.getElementById("quantityInput");

        const name = input.value.trim();
        const quantity = parseInt(quantityInput.value);

        if (name === "") {
            input.focus();
            return;
        }

        const product = {
            id: Date.now(),
            name: name,
            quantity: quantity > 0 ? quantity : 1,
            checked: false
        };

        products.push(product);

        save();

        input.value = "";
        quantityInput.value = 1;

        input.focus();

        render();
    }

    function toggleProduct(id) {

        const product = products.find(p => p.id === id);

        if (product) {
            product.checked = !product.checked;
        }

        save();
        render();
    }

    function deleteProduct(id) {

        products = products.filter(p => p.id !== id);

        save();
        render();
    }

    function removeChecked() {

        products = products.filter(p => !p.checked);

        save();
        render();
    }

    function clearAll() {

        if (products.length === 0) {
            return;
        }

        const confirmDelete = confirm(
            "¿Seguro que quieres borrar toda la lista?"
        );

        if (confirmDelete) {
            products = [];

            save();
            render();
        }
    }

    function save() {

        localStorage.setItem(
            "shoppingList",
            JSON.stringify(products)
        );
    }

    function render() {

        const list = document.getElementById("list");
        const counter = document.getElementById("counter");

        list.innerHTML = "";

        if (products.length === 0) {

            list.innerHTML = `
                <div class="empty">
                    <div style="font-size:50px;">🛒</div>
                    <p>Tu lista está vacía</p>
                    <p>Añade algo para empezar.</p>
                </div>
            `;

            counter.innerText = "";

            return;
        }

        // Productos sin comprar primero
        const sortedProducts = [...products].sort(
            (a, b) => a.checked - b.checked
        );

        sortedProducts.forEach(product => {

            const item = document.createElement("div");

            item.className =
                "item" + (product.checked ? " checked" : "");

            item.innerHTML = `
                <div
                    class="check"
                    onclick="toggleProduct(${product.id})"
                >
                    ${product.checked ? "✓" : ""}
                </div>

                <div class="item-content">
                    <div class="product-name">
                        ${escapeHTML(product.name)}
                    </div>

                    <div class="quantity">
                        Cantidad: ${product.quantity}
                    </div>
                </div>

                <button
                    class="delete"
                    onclick="deleteProduct(${product.id})"
                >
                    ×
                </button>
            `;

            list.appendChild(item);
        });

        const pending = products.filter(p => !p.checked).length;
        const completed = products.filter(p => p.checked).length;

        counter.innerText =
            `${pending} pendientes · ${completed} comprados`;
    }

    // Evita que un producto pueda introducir HTML
    function escapeHTML(text) {

        const div = document.createElement("div");

        div.textContent = text;

        return div.innerHTML;
    }

</script>

</body>
</html>
